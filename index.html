<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmisja z Kamerki</title>
  <!-- Biblioteka PeerJS do łatwego łączenia kamer w przeglądarce -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, input {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    input {
      color: #000;
    }

    .video-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .video-box {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    video {
      width: 400px;
      height: 300px;
      background-color: #000;
      border-radius: 6px;
      object-fit: cover;
    }

    .my-id {
      margin-top: 10px;
      font-weight: bold;
      color: #28a745;
    }
  </style>
</head>
<body>

  <h1>Transmisja na żywo</h1>

  <div class="my-id">Twoje ID transmisji: <span id="peer-id">Generowanie...</span></div>
  <p>Wyślij to ID osobom, które mają oglądać Twój stream!</p>

  <div class="controls">
    <button id="start-btn">1. Włącz moją kamerkę i nadawaj</button>
    <br>
    <input type="text" id="remote-id" placeholder="Wklej ID streamera">
    <button id="connect-btn">2. Oglądaj czyjąś transmisję</button>
  </div>

  <div class="video-container">
    <div class="video-box">
      <h3>Moja kamerka (NADAWANA)</h3>
      <video id="local-video" autoplay muted playsinline></video>
    </div>
    <div class="video-box">
      <h3>Obraz od kogoś (ODBIERANY)</h3>
      <video id="remote-video" autoplay playsinline></video>
    </div>
  </div>

  <script>
    // Inicjalizacja PeerJS (generuje unikalny identyfikator)
    const peer = new Peer();

    const peerIdSpan = document.getElementById('peer-id');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const startBtn = document.getElementById('start-btn');
    const connectBtn = document.getElementById('connect-btn');
    const remoteIdInput = document.getElementById('remote-id');

    let localStream = null;

    // Wyświetlenie unikalnego ID po połączeniu z serwerem PeerJS
    peer.on('open', (id) => {
      peerIdSpan.innerText = id;
    });

    // 1. Włączanie własnej kamerki po kliknięciu przycisku
    startBtn.addEventListener('click', async () => {
      try {
        // Prośba o dostęp do kamerki i mikrofonu
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        alert('Kamerka włączona! Teraz inni mogą się do Ciebie połączyć używając Twojego ID.');
      } catch (err) {
        console.error('Błąd uzyskiwania dostępu do kamerki:', err);
        alert('Nie udało się uzyskać dostępu do kamerki/mikrofonu.');
      }
    });

    // Obsługa sytuacji, gdy ktoś do nas dzwoni / chce oglądać nasz obraz
    peer.on('call', (call) => {
      if (localStream) {
        // Odpowiadamy na połączenie, wysyłając nasz obraz z kamerki
        call.answer(localStream);
      } else {
        alert('Ktoś próbuje obejrzeć Twój stream, ale nie włączyłeś jeszcze kamerki!');
      }
    });

    // 2. Połączenie się jako widz do kogoś innego
    connectBtn.addEventListener('click', () => {
      const remoteId = remoteIdInput.value.trim();
      if (!remoteId) {
        alert('Wpisz ID osoby, którą chcesz oglądać!');
        return;
      }

      // Łączymy się z podanym ID
      const call = peer.call(remoteId, localStream);

      // Gdy odbierzemy strumień wideo od streamera
      call.on('stream', (remoteStream) => {
        remoteVideo.srcObject = remoteStream;
      });
    });
  </script>
</body>
</html>
