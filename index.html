<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcel Rostek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            min-width: 320px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #1a1a1a;
            letter-spacing: 2px;
        }

        .clock-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 5px;
        }

        .clock {
            font-size: 4rem;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 25px;
        }

        .counter {
            font-size: 0.95rem;
            color: #555;
            background-color: #f0f4f8;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .counter span {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MARCEL ROSTEK</h1>
        <div class="clock-label">Aktualna godzina</div>
        <div class="clock" id="time">00:00</div>
        <div class="counter">Liczba odwiedzin: <span id="visit-count">0</span></div>
    </div>

    <script>
        // Obsługa zegara
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // Licznik odwiedzin w localStorage
        let visits = localStorage.getItem('page_visits');

        if (visits) {
            visits = parseInt(visits) + 1;
        } else {
            visits = 1;
        }

        localStorage.setItem('page_visits', visits);
        document.getElementById('visit-count').textContent = visits;
    </script>

</body>
</html>
