<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Pierwsza Strona</title>
    <style>
        /* Proste style CSS */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #0066cc;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        main {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
            background-color: white;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: white;
            margin-top: 2rem;
        }

        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #004b99;
        }
    </style>
</head>
<body>

    <header>
        <h1>Witaj na mojej stronie!</h1>
    </header>

    <main>
        <section>
            <h2>O mnie</h2>
            <p>To jest przykładowy akapit tekstu na stronie napisanej w HTML.</p>
        </section>

        <section>
            <h2>Lista ulubionych rzeczy:</h2>
            <ul>
                <li>Programowanie</li>
                <li>Muzyka</li>
                <li>Podróże</li>
            </ul>
        </section>

        <section>
            <h2>Interakcja</h2>
            <p>Kliknij poniższy przycisk, aby zobaczyć działanieJavaScript:</p>
            <button onclick="powitanie()">Kliknij mnie</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Moja Strona Internetowa</p>
    </footer>

    <script>
        // Prosty kod JavaScript
        function powitanie() {
            alert('Cześć! Dziękuję za kliknięcie.');
        }
    </script>

</body>
</html>
