<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podgląd Kamerki</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        h1 {
            color: #333;
        }

        #webcam {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 3px solid #333;
            border-radius: 8px;
            background-color: #000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #btnStart {
            background-color: #28a745;
        }

        #btnStart:hover {
            background-color: #218838;
        }

        #btnStop {
            background-color: #dc3545;
        }

        #btnStop:hover {
            background-color: #c82333;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Aplikacja Kamerki</h1>

    <!-- Element wideo wyświetlający obraz z kamery -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Przyciski do sterowania -->
    <div class="controls">
        <button id="btnStart" onclick="startCamera()">Włącz kamerkę</button>
        <button id="btnStop" onclick="stopCamera()" disabled>Wyłącz kamerkę</button>
    </div>

    <script>
        let stream = null;
        const videoElement = document.getElementById('webcam');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');

        // Funkcja uruchamiająca kamerkę
        async function startCamera() {
            try {
                // Prośba o dostęp do urządzenia wideo
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: false 
                });
                
                // Przypisanie strumienia z kamery do elementu <video>
                videoElement.srcObject = stream;

                // Aktywacja / dezaktywacja odpowiednich przycisków
                btnStart.disabled = true;
                btnStop.disabled = false;
            } catch (err) {
                console.error("Błąd podczas uzyskiwania dostępu do kamerki: ", err);
                alert("Nie udało się uzyskać dostępu do kamerki. Upewnij się, że wyraziłeś zgodę w przeglądarce i że żadna inna aplikacja z niej nie korzysta.");
            }
        }

        // Funkcja zatrzymująca kamerkę
        function stopCamera() {
            if (stream) {
                // Zatrzymanie wszystkich ścieżek wideo
                stream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
                stream = null;

                // Aktywacja / dezaktywacja odpowiednich przycisków
                btnStart.disabled = false;
                btnStop.disabled = true;
            }
        }
    </script>

</body>
</html>
