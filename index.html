<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcel Rostek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            min-width: 420px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #1a1a1a;
            letter-spacing: 2px;
        }

        .clock-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 5px;
        }

        .clock {
            font-size: 3.5rem;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 20px;
        }

        .status-box {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f0f4f8;
            font-size: 0.95rem;
            text-align: left;
        }

        .status {
            font-weight: bold;
            color: #28a745;
        }

        .info-row {
            margin-top: 6px;
            color: #444;
        }

        .info-row span {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MARCEL ROSTEK</h1>
        <div class="clock-label">Aktualna godzina</div>
        <div class="clock" id="time">00:00:00</div>

        <div class="status-box">
            <div>Status: <span class="status">Na stronie</span></div>
            <div class="info-row">Wejście: <span id="current-entry-time">--:--:--</span></div>
            <div class="info-row">Czas trwania obecnej wizyty: <span id="current-session-duration">00g 00m 00s</span></div>
            
            <div style="margin-top: 12px; border-top: 1px solid #cbd5e1; padding-top: 10px;">
                <div class="info-row" style="color: #1e293b; font-weight: bold; margin-bottom: 4px;">Ostatnia zakończona wizyta:</div>
                <div class="info-row">Od: <span id="last-entry">--:--:--</span> do: <span id="last-exit">--:--:--</span></div>
                <div class="info-row">Trwała: <span id="last-duration">Brak poprzednich wizyt</span></div>
            </div>

            <div class="info-row" style="margin-top: 12px; border-top: 1px solid #cbd5e1; padding-top: 10px;">
                Łącznie spędzony czas (wszystkie wizyty): <span id="total-time">00g 00m 00s</span>
            </div>
        </div>
    </div>

    <script>
        // Główny zegar strony
        function updateClock() {
            const now = new Date();
            document.getElementById('time').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Funkcja do ładnego formatowania sekund na godziny, minuty, sekundy
        function formatHMS(totalSec) {
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            return `${String(h).padStart(2, '0')}g ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
        }

        const nowSec = Math.floor(Date.now() / 1000);
        const nowDate = new Date();
        const nowTimeString = nowDate.toTimeString().split(' ')[0];

        // Odczyt z pamięci przeglądarki poprzedniej sesji (jeśli istnieje)
        let lastEntryStr = localStorage.getItem('active_entry_str');
        let lastEntryTimestamp = localStorage.getItem('active_entry_timestamp');

        let totalSeconds = parseInt(localStorage.getItem('total_seconds')) || 0;

        if (lastEntryTimestamp) {
            // Skoro istniał zapisany początek starej sesji, to znaczy że użytkownik właśnie "weszedł ponownie"
            // Wyliczamy kiedy wyszedł (teraz) i jak długo trwała tamta wizyta
            let prevStart = parseInt(lastEntryTimestamp);
            let duration = nowSec - prevStart;
            if (duration < 0) duration = 0;

            let prevExitStr = nowTimeString;

            // Zapisujemy dane o ostatniej zakończonej wizycie do localStorage, żeby były widoczne
            localStorage.setItem('last_entry_str', lastEntryStr);
            localStorage.setItem('last_exit_str', prevExitStr);
            localStorage.setItem('last_duration', duration);

            // Dodajemy czas tamtej wizyty do łącznego czasu
            totalSeconds += duration;
            localStorage.setItem('total_seconds', totalSeconds);
        }

        // Wyświetlenie danych o ostatniej wizycie na ekranie
        if (localStorage.getItem('last_entry_str')) {
            document.getElementById('last-entry').textContent = localStorage.getItem('last_entry_str');
            document.getElementById('last-exit').textContent = localStorage.getItem('last_exit_str');
            let lastDurSec = parseInt(localStorage.getItem('last_duration')) || 0;
            document.getElementById('last-duration').textContent = formatHMS(lastDurSec);
        }

        // Ustawienie nowej, bieżącej wizyty
        localStorage.setItem('active_entry_timestamp', nowSec);
        localStorage.setItem('active_entry_str', nowTimeString);
        document.getElementById('current-entry-time').textContent = nowTimeString;
        document.getElementById('total-time').textContent = formatHMS(totalSeconds);

        // Licznik na żywo dla aktualnej sesji
        setInterval(() => {
            const currentSec = Math.floor(Date.now() / 1000);
            const sessionDuration = currentSec - nowSec;

            document.getElementById('current-session-duration').textContent = formatHMS(sessionDuration);
            document.getElementById('total-time').textContent = formatHMS(totalSeconds + sessionDuration);
        }, 1000);
    </script>

</body>
</html>
