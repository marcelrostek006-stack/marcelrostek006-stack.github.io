<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcel Rostek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            min-width: 380px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #1a1a1a;
            letter-spacing: 2px;
        }

        .clock-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 5px;
        }

        .clock {
            font-size: 3.5rem;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 20px;
        }

        .status-box {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f0f4f8;
            font-size: 0.95rem;
            text-align: left;
        }

        .status {
            font-weight: bold;
            color: #28a745;
        }

        .info-row {
            margin-top: 6px;
            color: #444;
        }

        .info-row span {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MARCEL ROSTEK</h1>
        <div class="clock-label">Aktualna godzina</div>
        <div class="clock" id="time">00:00:00</div>

        <div class="status-box">
            <div>Status: <span class="status">Na stronie (Aktywny)</span></div>
            <div class="info-row">Ostatnie wejście: <span id="entry-time-str">--:--:--</span></div>
            <div class="info-row">Czas tej wizyty: <span id="current-session-time">00g 00m 00s</span></div>
            <div class="info-row">Liczba odwiedzin: <span id="visit-count">0</span></div>
            <div class="info-row" style="margin-top: 10px; border-top: 1px solid #ddd; padding-top: 8px;">
                Łącznie spędzony czas: <span id="total-time">00g 00m 00s</span>
            </div>
        </div>
    </div>

    <script>
        // Główny zegar strony
        function updateClock() {
            const now = new Date();
            document.getElementById('time').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Formatowanie czasu na godziny, minuty, sekundy
        function formatHMS(totalSec) {
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            return `${String(h).padStart(2, '0')}g ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
        }

        // Inicjalizacja wizyty po wejściu na stronę
        let visits = parseInt(localStorage.getItem('visit_count')) || 0;
        visits += 1;
        localStorage.setItem('visit_count', visits);
        document.getElementById('visit-count').textContent = visits;

        const sessionStartTimestamp = Math.floor(Date.now() / 1000);
        const entryDate = new Date();
        const entryTimeString = entryDate.toTimeString().split(' ')[0];
        document.getElementById('entry-time-str').textContent = entryTimeString;

        let totalSeconds = parseInt(localStorage.getItem('total_seconds')) || 0;

        // Pętla aktualizująca czas trwania bieżącej sesji oraz łączny czas
        setInterval(() => {
            const nowSec = Math.floor(Date.now() / 1000);
            const currentSessionSec = nowSec - sessionStartTimestamp;

            document.getElementById('current-session-time').textContent = formatHMS(currentSessionSec);
            document.getElementById('total-time').textContent = formatHMS(totalSeconds + currentSessionSec);
        }, 1000);

        // Zapisywanie czasu do localStorage w momencie opuszczania / zamykania karty
        window.addEventListener('beforeunload', () => {
            const nowSec = Math.floor(Date.now() / 1000);
            const currentSessionSec = nowSec - sessionStartTimestamp;
            localStorage.setItem('total_seconds', totalSeconds + currentSessionSec);
        });
    </script>

</body>
</html>
